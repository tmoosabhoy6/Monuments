<!doctype html>
<html lang="en">
<head>
{{> head}}
</head>
<body data-page="gallery">
{{> header}}
<main id="main">
  <section class="banner banner-solo">
    <div class="wrap banner-grid">
      <div class="banner-text">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span aria-hidden="true"></span><span aria-current="page">Gallery</span></nav>
        <h1 class="display"><span class="line"><span>The gallery.</span></span></h1>
        <p class="lede">{{@photo_count}} photographs of monument signs. Choose a group, or open any photograph to see it larger.</p>
      </div>
    </div>
  </section>

  <section class="section section-tight" aria-label="Photographs">
    <div class="wrap">
      {{@gallery_filters}}
      {{@gallery_grid}}
    </div>
  </section>
  <dialog class="lightbox" aria-label="Photograph" data-lightbox>
    <button type="button" class="lb-close" data-lb-close aria-label="Close">×</button>
    <button type="button" class="lb-nav lb-prev" data-lb-prev aria-label="Previous photograph">{{> icon-arrow}}</button>
    <figure><img alt="" data-lb-img><figcaption data-lb-cap></figcaption></figure>
    <button type="button" class="lb-nav lb-next" data-lb-next aria-label="Next photograph">{{> icon-arrow}}</button>
  </dialog>
</main>
{{> footer}}
{{> titleblock}}
{{> dialogs}}
{{@site_data}}
</body>
</html>
