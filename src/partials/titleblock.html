<div class="title-block" data-title-block hidden>

    <button type="button" class="tb-sign" data-open-builder>
      <span class="tb-thumb" data-tb-thumb></span>
      <span class="tb-spec"><span class="tb-name" data-tb-name></span><span class="tb-summary" data-tb-summary></span></span>
    </button>
    <p class="tb-price"><span data-tb-deposit></span><span class="money" data-tb-total></span></p>

  </div>
</div>
