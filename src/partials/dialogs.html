<dialog class="dialog" id="dialog-reserve" aria-labelledby="reserve-title">
  <div class="dialog-head"><h2 id="reserve-title">Reserve with deposit</h2><button type="button" class="link-button" data-close-dialog>Close</button></div>
  <p data-reserve-intro></p>
  <form data-form="reserve" novalidate>
    <div class="field"><label for="r-name">Your name</label><input class="input" id="r-name" name="name" autocomplete="name" maxlength="120" required></div>
    <div class="field"><label for="r-email">Email</label><input class="input" id="r-email" name="email" type="email" autocomplete="email" maxlength="200" spellcheck="false" required></div>
    <div class="field"><label for="r-phone">Phone (optional)</label><input class="input" id="r-phone" name="phone" type="tel" autocomplete="tel" maxlength="40"></div>
    <div class="field"><label for="r-zip">ZIP code where it will stand</label><input class="input" id="r-zip" name="zip" inputmode="numeric" autocomplete="postal-code" maxlength="5" pattern="[0-9]{5}" spellcheck="false" required></div>
    {{@form_extras}}
    <div class="actions"><button type="submit" class="btn">Continue to payment</button></div>
  </form>
  <div data-form-result hidden></div>
</dialog>

<dialog class="dialog" id="dialog-drawing" aria-labelledby="drawing-title">
  <div class="dialog-head"><h2 id="drawing-title">Request your approval drawing</h2><button type="button" class="link-button" data-close-dialog>Close</button></div>
  <p>{{drawing_dialog_intro}}</p>
  <form data-form="drawing" novalidate>
    <div class="field"><label for="d-name">Your name</label><input class="input" id="d-name" name="name" autocomplete="name" maxlength="120" required></div>
    <div class="field"><label for="d-org">Organization (optional)</label><input class="input" id="d-org" name="organization" autocomplete="organization" maxlength="160"></div>
    <div class="field"><label for="d-email">Email</label><input class="input" id="d-email" name="email" type="email" autocomplete="email" maxlength="200" spellcheck="false" required></div>
    <div class="field"><label for="d-phone">Phone (optional)</label><input class="input" id="d-phone" name="phone" type="tel" autocomplete="tel" maxlength="40"></div>
    <div class="field"><label for="d-zip">ZIP code where it will stand</label><input class="input" id="d-zip" name="zip" inputmode="numeric" autocomplete="postal-code" maxlength="5" pattern="[0-9]{5}" spellcheck="false" required></div>
    <div class="field"><label for="d-notes">Anything we should know? (optional)</label><textarea class="input" id="d-notes" name="notes" maxlength="4000"></textarea></div>
    <div class="field" data-feature="file_uploads"><label for="d-files">Logo or artwork (optional)</label><input class="input" id="d-files" name="files" type="file" multiple accept=".png,.jpg,.jpeg,.svg,.pdf,.ai,.eps,.webp"></div>
    {{@form_extras}}
    <div class="actions"><button type="submit" class="btn">Request approval drawing</button></div>
  </form>
  <div data-form-result hidden></div>
</dialog>

<dialog class="dialog" id="dialog-share" aria-labelledby="share-title">
  <div class="dialog-head"><h2 id="share-title">Save or send this design</h2><button type="button" class="link-button" data-close-dialog>Close</button></div>
  <p class="help">The link opens this exact sign, with its options and price, for anyone you send it to.</p>
  <div class="actions">
    <button type="button" class="btn btn-secondary" data-copy-link>Copy link</button>
    <button type="button" class="btn btn-secondary" data-print>Print the design sheet</button>
  </div>
  <form data-form="email-design" data-feature="email_design" novalidate>
    <div class="field"><label for="s-email">Email it to me</label><input class="input" id="s-email" name="email" type="email" autocomplete="email" maxlength="200" spellcheck="false" required></div>
    {{@form_extras}}
    <div class="actions"><button type="submit" class="btn">Send design</button></div>
  </form>
  <div data-form-result hidden></div>
</dialog>

<dialog class="dialog" id="dialog-invoice" aria-labelledby="invoice-title">
  <div class="dialog-head"><h2 id="invoice-title">Pay an invoice</h2><button type="button" class="link-button" data-close-dialog>Close</button></div>
  <form data-form="invoice" novalidate>
    <div class="field"><label for="i-number">Invoice number</label><input class="input" id="i-number" name="number" autocomplete="off" maxlength="60" spellcheck="false" required></div>
    <div class="field"><label for="i-email">Email the invoice was sent to</label><input class="input" id="i-email" name="email" type="email" autocomplete="email" maxlength="200" spellcheck="false" required></div>
    {{@form_extras}}
    <div class="actions"><button type="submit" class="btn">Find invoice</button></div>
  </form>
  <div data-form-result hidden></div>
</dialog>
